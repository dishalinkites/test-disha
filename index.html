<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Tic-Tac-Toe</h1>
    <div class="controls">
      <label>
        <input type="checkbox" id="vs-ai" />
        Play vs AI (O)
      </label>
      <button id="reset">Reset</button>
    </div>
    <div class="status" id="status"></div>
    <div class="board" id="board" aria-label="Tic Tac Toe Board" role="grid"></div>
    <div class="scoreboard">
      <div>X Wins: <span id="x-score">0</span></div>
      <div>O Wins: <span id="o-score">0</span></div>
      <div>Draws: <span id="d-score">0</span></div>
    </div>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
